[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uv-wheel-download"
version = "0.1.1"
description = "Download every wheel/sdist pinned in uv.lock into a local folder for offline installs (a pip-free `pip download`)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "packaging>=24.0",
    "requests>=2.32.0",
]

[project.urls]
Repository = "https://github.com/bmsuisse/uv-wheel-download"

[project.scripts]
uv-wheel-download = "uv_wheel_download.cli:main"

[dependency-groups]
dev = [
    "ty>=0.0.100",
    "ruff>=0.17.4",
]
test = [
    "pytest>=9.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["uv_wheel_download"]

[tool.uv]
# Dependency cooldown: releases younger than 5 days are not resolved (relative span, never an absolute date).
exclude-newer = "5 days"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"
extend-exclude = ["*.md", ".worktrees", ".claude"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E", "F", "I",   # pycodestyle, pyflakes, isort
    "UP",            # pyupgrade - X | None, modern syntax
    "B",             # bugbear - mutable defaults etc.
    "ANN",           # full type annotations
    "SIM", "C4",     # simplifiable code, needless comprehensions/casts
    "PERF", "FURB",  # needless loops, manual list/dict building
    "ASYNC",         # blocking calls inside async def
    "RUF",
    "N",             # PEP 8 naming
    "PTH",           # pathlib instead of os.path
    "TID",           # absolute imports only, banned APIs
    "RET", "PIE",    # consistent returns, misc simplifications
    "A",             # no shadowing builtins
    "T20",           # no print()
    "LOG",           # logging API misuse
    "DTZ",           # timezone-aware datetimes
    "FLY",           # f-string instead of str.join on literals
    "PLE", "PLW",    # pylint errors + warnings
]
ignore = ["ANN401"]  # `Any` is a warning via the ruff-warn-any prek hook, not an error

[tool.ruff.lint.per-file-ignores]
"uv_wheel_download/cli.py" = ["T20"]  # CLI: print() to stdout/stderr is the user-facing output

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.src]
exclude = [".worktrees", ".claude"]
